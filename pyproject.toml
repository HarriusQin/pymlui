[project]
name = "pymlui"
version = "0.1.0"
description = "ML UI - A machine learning GUI application with PyQt6"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "shap",
    "PyQt6",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "gui"]
